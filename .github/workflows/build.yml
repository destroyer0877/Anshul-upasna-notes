name: Build Android APK 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch: # Tujhe manually button se build karne ka option dega

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17' # Modern Android builds ke liye best

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK 🏗️
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK 📦
        uses: actions/upload-artifact@v4
        with:
          name: Smart-AI-Notepad-APK
          path: app/build/outputs/apk/**/*.apk
