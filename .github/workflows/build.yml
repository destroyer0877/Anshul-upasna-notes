name: Build Android APK 🚀

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Fix Corrupt Gradle Wrapper 🛠️
        run: gradle wrapper

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate Debug Keystore 🔑
        run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

      - name: Build Debug APK 🏗️
        run: ./gradlew clean assembleDebug --no-daemon --no-build-cache

      - name: Upload APK 📦
        uses: actions/upload-artifact@v4
        with:
          name: Smart-AI-Notepad-APK
          path: app/build/outputs/apk/**/*.apk
